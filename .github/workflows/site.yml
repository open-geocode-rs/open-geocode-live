name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The system check opens the built system page in a browser to measure it at 390 wide.
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run lint
      - run: bun run lint:probes
      - run: bun run check
      - run: bun scripts/contrast.mjs
      - run: bun scripts/system-check.mjs
      - run: bun run check:reference
      # Drives the dist/ the system check just built.
      - run: bun run check:behaviour --no-build
      - run: bun run build
